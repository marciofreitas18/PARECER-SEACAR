<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema SEACAR / PROGESP - UFFS</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- PDF.js - Leitor de PDF no Navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow mx-auto" style="max-width: 750px;">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Gerador de Parecer SEACAR e Minuta PROGESP</h4>
                <small>Universidade Federal da Fronteira Sul - UFFS</small>
            </div>
            <div class="card-body p-4">
                
                <div class="mb-4">
                    <label for="pdfCRSCInput" class="form-label fw-bold">1. Selecione o PDF do Parecer emitido pela CRSC:</label>
                    <input class="form-control form-control-lg" type="file" id="pdfCRSCInput" accept=".pdf">
                    <div class="form-text">Envie o parecer extraído do processo no SIPAC.</div>
                </div>

                <!-- Painel de Status -->
                <div id="statusLeitura" class="alert alert-secondary text-center d-none" role="alert">
                    Aguardando envio do arquivo...
                </div>

                <!-- Painel de Ações e Downloads -->
                <div id="acoesGeracao" class="d-none mt-4 pt-3 border-top">
                    <h5 class="text-center mb-3 fw-bold text-secondary">2. Baixar Documentos Gerados</h5>
                    <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                        <button id="btnGerarSeacar" class="btn btn-outline-primary btn-lg px-4">
                            📄 Baixar Parecer SEACAR (.html)
                        </button>
                        <button id="btnGerarPortaria" class="btn btn-outline-success btn-lg px-4">
                            📜 Baixar Minuta Portaria (.doc)
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Carregamento dos Scripts do Sistema -->
    <script src="js/parse-parecer-crsc.js"></script>
    <script src="js/parecer-seacar-pdf.js"></script>
    <script src="js/minuta-portaria-pdf.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
<!-- Cole este bloco dentro da <div class="card-body p-4"> logo após a div 'acoesGeracao' -->
<div id="secaoRelatorio" class="mt-5 pt-4 border-top">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold text-secondary mb-0">📊 Controle de Processos Analisados</h5>
        <div>
            <button id="btnExportarExcel" class="btn btn-sm btn-outline-success me-2">📥 Exportar Planilha (.csv)</button>
            <button id="btnLimparHistorico" class="btn btn-sm btn-outline-danger">🗑️ Limpar Histórico</button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle style-table">
            <thead class="table-dark">
                <tr>
                    <th>Data/Hora</th>
                    <th>Processo</th>
                    <th>Servidor(a)</th>
                    <th>SIAPE</th>
                    <th>Nível</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody id="tabelaHistorico">
                <!-- As linhas do relatório serão inseridas aqui dinamicamente -->
            </tbody>
        </table>
    </div>
</div>
