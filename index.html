<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Parecer SEACAR e Minuta PROGESP - UFFS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Biblioteca para leitura de PDF no Navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 800px;">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Gerador SEACAR / PROGESP (UFFS)</h3>
            </div>
            <div class="card-body">
                <p class="card-text">Faça o upload do <b>Parecer da CRSC (PDF)</b> extraído do processo para gerar automaticamente o Parecer do SEACAR e a Minuta de Portaria.</p>
                
                <div class="mb-3">
                    <label for="pdfCRSCInput" class="form-label font-weight-bold"><b>Selecione o arquivo PDF da CRSC:</b></label>
                    <input class="form-control" type="file" id="pdfCRSCInput" accept=".pdf">
                </div>

                <div id="statusLeitura" class="alert alert-info d-none" role="alert">
                    Aguardando envio do arquivo...
                </div>

                <div id="acoesGeracao" class="d-none mt-4 text-center">
                    <hr>
                    <h5>Documentos Prontos para Emissão:</h5>
                    <div class="d-flex justify-content-center gap-3 mt-3">
                        <button id="btnGerarSeacar" class="btn btn-outline-primary btn-lg">📄 Baixar Parecer SEACAR (.html)</button>
                        <button id="btnGerarPortaria" class="btn btn-outline-success btn-lg">📜 Baixar Minuta Portaria (.doc)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts do Sistema -->
    <script src="js/parse-parecer-crsc.js"></script>
    <script src="js/parecer-seacar-pdf.js"></script>
    <script src="js/minuta-portaria-pdf.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
